[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artefaktum"
version = "0.1.0"
description = "Python client and CLI for Artefaktum: store, find and trust the artifacts that agents hand to each other."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.27"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://artefaktum.dev"
Source = "https://github.com/artefaktum-dev/artefaktum-python"
Issues = "https://github.com/artefaktum-dev/artefaktum-python/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "click>=8.1"]
cli = ["click>=8.1"]

[project.scripts]
artefaktum = "artefaktum.cli:main"
afk = "artefaktum.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/artefaktum"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Exception names mirror the server's error codes (`errors.py`) and are the names the
# tests and design spec import; an "Error" suffix would break that vocabulary.
"src/artefaktum/errors.py" = ["N818"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/artefaktum"]
